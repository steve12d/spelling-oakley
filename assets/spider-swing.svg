<svg xmlns="http://www.w3.org/2000/svg" width="200" height="300" viewBox="0 0 200 300">
  <style>
    .drop { animation: drop 0.6s cubic-bezier(.3,1.6,.6,1) both; }
    .swing { transform-origin: 100px 0px; animation: swing 1.2s ease-in-out 0.5s infinite alternate; }
    @keyframes drop { from { transform: translateY(-260px); } to { transform: translateY(0); } }
    @keyframes swing { from { transform: rotate(-14deg); } to { transform: rotate(14deg); } }
  </style>
  <g class="swing"><g class="drop">
    <line x1="100" y1="0" x2="100" y2="150" stroke="#cfd6e4" stroke-width="3"/>
    <g transform="translate(40 140)">  <!-- legs -->
  <g fill="none" stroke="#1d3fbf" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M38 52 L18 38 L8 50"/>
    <path d="M36 64 L14 62 L6 76"/>
    <path d="M38 76 L20 86 L16 102"/>
    <path d="M44 84 L34 100 L36 114"/>
    <path d="M82 52 L102 38 L112 50"/>
    <path d="M84 64 L106 62 L114 76"/>
    <path d="M82 76 L100 86 L104 102"/>
    <path d="M76 84 L86 100 L84 114"/>
  </g>
  <!-- body -->
  <circle cx="60" cy="64" r="30" fill="#e0262b" stroke="#1a1a1a" stroke-width="3"/>
  <!-- web lines on the head -->
  <g fill="none" stroke="#1a1a1a" stroke-width="1.4" opacity="0.75">
    <path d="M60 34 V94 M30 64 H90 M39 43 L81 85 M81 43 L39 85"/>
    <circle cx="60" cy="64" r="11"/>
    <circle cx="60" cy="64" r="21"/>
  </g>
  <!-- big hero eyes -->
  <path d="M56 62 C48 50 36 50 34 56 C34 66 44 72 56 62 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"/>
  <path d="M64 62 C72 50 84 50 86 56 C86 66 76 72 64 62 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"/>
  <!-- smile -->
  <path d="M50 79 Q60 87 70 79" fill="none" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
</g>
    <text x="100" y="292" text-anchor="middle" font-family="Bangers, Impact, 'Arial Black', sans-serif" font-size="40" fill="#e0262b" stroke="#1a1a1a" stroke-width="1.5" letter-spacing="2">THWIP!</text>
  </g></g>
</svg>